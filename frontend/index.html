
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <h1 class="logo">NoteSpace</h1>

            <button id="new-note-btn" class="new-note-btn">
                + New Note
            </button>

            <nav class="navigation">
                <a href="index.html" class="active">All Notes</a>
                <a href="pages/pinned.html">Pinned</a>
                <a href="pages/trash.html">Trash</a>
                <a href="pages/settings.html">Settings</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h2>My Notes</h2>
                    <p>Your thoughts, organized in one place.</p>
                </div>

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search notes..."
                >
            </header>

            <section class="notes-section">
                <div id="notes-container" class="notes-grid">
                    <!-- Notes will be displayed here -->
                </div>
            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
