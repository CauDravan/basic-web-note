<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NoteSpace: create, organize and search your notes in one place.">
  <meta name="theme-color" content="#ffffff">
  <title>Note · NoteSpace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/note.js"></script>
</head>
<body data-base="../" data-page="note" data-title="Note" data-icon="📄">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <main class="mx-auto w-full max-w-[760px] px-5 pb-40 pt-6 md:px-12 md:pt-10">
      <div id="note-state" class="py-10 text-mut2">Loading note…</div>
      <article id="note-root" hidden>
        <div id="banner"></div>
        <button id="icon-btn" class="-ml-2 grid h-20 w-20 place-items-center rounded-lg text-6xl leading-none hover:bg-hov disabled:hover:bg-transparent" type="button" aria-label="Change icon" aria-haspopup="menu"></button>
        <input id="title" class="my-2 w-full bg-transparent text-[32px] font-bold leading-tight outline-none placeholder:text-mut md:text-[40px]" type="text" placeholder="Untitled" maxlength="200" aria-label="Note title" autocomplete="off">
        <div class="mb-4 border-b border-line pb-3 text-[13px]">
          <label class="flex min-h-[30px] items-center gap-2"><span class="w-[120px] flex-none text-mut">Tags</span>
            <input id="tags" class="min-w-0 flex-1 bg-transparent outline-none placeholder:text-mut" type="text" placeholder="Empty (separate with commas)" aria-label="Tags"></label>
          <div class="flex min-h-[30px] items-center gap-2"><span class="w-[120px] flex-none text-mut">Last edited</span><span id="edited"></span></div>
        </div>
        <textarea id="content" class="min-h-[50vh] w-full resize-none bg-transparent leading-relaxed outline-none placeholder:text-mut" placeholder="Start writing…" aria-label="Note content"></textarea>
      </article>
    </main>
  </div>
</body>
</html>
