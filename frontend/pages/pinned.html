<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NoteSpace: create, organize and search your notes in one place.">
  <meta name="theme-color" content="#ffffff">
  <title>Pinned · NoteSpace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/notes.js"></script>
</head>
<body data-base="../" data-page="pinned" data-title="Pinned" data-icon="⭐">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <main class="mx-auto w-full max-w-[856px] px-5 pb-28 pt-6 md:px-12">
      <h1 class="mb-1.5 text-[28px] font-bold leading-tight md:text-[32px]">Pinned</h1>
      <p class="mb-6 text-mut2">Notes you starred for quick access.</p>
      <div class="flex items-center justify-between pb-1.5 pt-2.5">
        <h2 class="text-xs font-semibold text-mut">Favorites</h2>
        <span class="flex items-center gap-3"><span id="notes-count" class="text-xs text-mut"></span></span>
      </div>
      <div id="notes-container" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
